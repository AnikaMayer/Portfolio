<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="ball">
      <circle cx="150" cy="150" r="140"/>
    </clipPath>
    <radialGradient id="redShade" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff2a2a"/>
      <stop offset="0.7" stop-color="#e01010"/>
      <stop offset="1" stop-color="#b80c0c"/>
    </radialGradient>
    <radialGradient id="whiteShade" cx="40%" cy="30%" r="90%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#d5d8e6"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#ball)">
    <!-- Obere Hälfte (rot) -->
    <rect x="0" y="0" width="300" height="150" fill="url(#redShade)"/>
    <!-- Untere Hälfte (weiß) -->
    <rect x="0" y="150" width="300" height="150" fill="url(#whiteShade)"/>
    <!-- Mittleres Band -->
    <rect x="0" y="138" width="300" height="24" fill="#3a3a3f"/>
  </g>

  <!-- Glanzlicht oben links -->
  <ellipse cx="82" cy="62" rx="24" ry="11" transform="rotate(-38 82 62)" fill="#ffffff"/>
  <circle cx="58" cy="88" r="4.5" fill="#ffffff"/>

  <!-- Außenkontur -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#1c1c1c" stroke-width="7"/>
  <line x1="10" y1="138" x2="290" y2="138" stroke="#1c1c1c" stroke-width="4" clip-path="url(#ball)"/>
  <line x1="10" y1="162" x2="290" y2="162" stroke="#1c1c1c" stroke-width="4" clip-path="url(#ball)"/>

  <!-- Mittlerer Knopf -->
  <circle cx="150" cy="150" r="42" fill="#3a3a3f" stroke="#1c1c1c" stroke-width="5"/>
  <circle cx="150" cy="150" r="28" fill="#ffffff" stroke="#1c1c1c" stroke-width="4"/>
  <circle cx="150" cy="150" r="17" fill="#e6e7ee"/>
</svg>
