<section id="reference-section" class="ref">
  <div class="content">
    <h2>What my colleagues say about me</h2>
    <div class="ref__wrapper">
      @for (ref of refList; track ref.name; let i = $index) {
        <div class="ref__box ref__box--box{{ i + 1 }}">
          <div class="ref__box--content">
            <h3>{{ ref.name }}</h3>
            <p>{{ ref.text }}</p>
            <p>{{ ref.job }}</p>
          </div>
          <a [href]="ref.link" target="_blank">To Linkedin profile &gt;&gt;</a>
        </div>
      }
    </div>
  </div>
</section>
