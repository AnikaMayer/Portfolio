<section id="portfolio-section" class="projects">
  <div class="content">
    <div class="projects__header">
      <h2>{{ 'projects.title' | translate }}</h2>
      <div class="projects__header--text">
        <p>
          {{ 'projects.text' | translate }}
        </p>
      </div>
    </div>
    <div class="projects__wrapper">
      <div class="projects__img" [class]="currentColorClass()">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <use href="./assets/images/icons/icons.svg#radialburst"></use>
        </svg>
        <div class="projects__img--box">
          <img [src]="currentProject().image" [alt]="'Image of ' + currentProject().title" />
        </div>
      </div>
      <div class="projects__info-wrapper">
        <div class="projects__info">
          <div class="projects__info--text">
            <div>
              <h3>{{ currentProject().title }}</h3>
              <button>
                <img [src]="currentProject().icon" [alt]="'Icon of ' + currentProject().title" />
              </button>
            </div>
            <ul>
              @for (item of currentProject().technologies; track item) {
                <li>{{ item }}</li>
              }
            </ul>
            <p>
              {{ currentProject().description | translate }}
            </p>
          </div>
          <div class="projects__info--btn">
            <a
              appBtn
              [href]="currentProject().gitUrl"
              target="_blank"
              [attr.aria-label]="'Open ' + currentProject().title + '-repository in new tab'"
            >
              GitHub
              <svg width="20" height="20" aria-hidden="true">
                <use href="./assets/images/icons/icons.svg#arrow"></use>
              </svg>
            </a>
            <a
              appBtn
              [href]="currentProject().liveUrl"
              target="_blank"
              [attr.aria-label]="'Open ' + currentProject().title + ' in new Tab'"
            >
              Live Test
              <svg width="20" height="20" aria-hidden="true">
                <use href="./assets/images/icons/icons.svg#arrow"></use>
              </svg>
            </a>
          </div>
        </div>
        <div class="projects__navBtn">
          <button
            class="projects__navBtn--prev"
            aria-label="Previous project"
            (click)="prevProject()"
          >
            &lt;&lt; {{ 'projects.prev' | translate }}
          </button>
          <button class="projects__navBtn--next" aria-label="Next project" (click)="nextProject()">
            {{ 'projects.next' | translate }} &gt;&gt;
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
