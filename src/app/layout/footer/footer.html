<div class="content footer">
  <div class="footer__animation">
    <div class="gear-left">
      <svg viewBox="0 0 180 180" aria-hidden="true" class="footer__animation--left">
        <use href="./assets/images/icons/icons.svg#radialburst"></use>
      </svg>
    </div>
    <div class="gear-right">
      <svg viewBox="0 0 263 263" aria-hidden="true" class="footer__animation--right">
        <use href="./assets/images/icons/icons.svg#radialburst"></use>
      </svg>
    </div>
  </div>
  <div class="footer__name"><p>© Anika Mayer 2026</p></div>
  <nav class="footer__links" [attr.aria-label]="'aria.footerNav' | translate">
    <a routerLink="/legal-notice">
      @if (languageService.currentLang() === 'en') {
        Legal Notice
      } @else {
        Impressum
      }
    </a>
    <a
      href="https://www.linkedin.com/in/anika-mayer"
      target="_blank"
      [attr.aria-label]="'aria.linkedin' | translate"
      >LinkedIn</a
    >
    <a
      href="https://github.com/AnikaMayer"
      target="_blank"
      [attr.aria-label]="'aria.github' | translate"
      >GitHub</a
    >
  </nav>
</div>
